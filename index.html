<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>
        Inventario - Pastillas de Freno
    </title>

    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body>

    <main id="app">

        <header class="page-header">

            <h1>
                Pastillas de Freno
            </h1>

            <p>
                Gestión de inventario
            </p>

        </header>


        <div class="inventory-layout">


            <!-- FORMULARIO -->

            <section class="card">

                <h2
                    class="form-title"
                    id="formTitle"
                >
                    Agregar producto
                </h2>


                <form
                    id="inventoryForm"
                >

                    <div class="form-group">

                        <label for="code">
                            Código
                        </label>

                        <input
                            class="form-control"
                            id="code"
                            type="text"
                            maxlength="50"
                            placeholder="Ej. BP-001"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="carBrand">
                            Marca del carro
                        </label>

                        <input
                            class="form-control"
                            id="carBrand"
                            type="text"
                            maxlength="100"
                            placeholder="Ej. Toyota"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="price">
                            Precio (S/)
                        </label>

                        <input
                            class="form-control"
                            id="price"
                            type="number"
                            min="0"
                            step="0.01"
                            placeholder="Ej. 85.50"
                            required
                        >

                    </div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="saveButton"
                        >
                            Guardar
                        </button>

                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="cancelButton"
                            hidden
                        >
                            Cancelar
                        </button>

                    </div>

                </form>


                <div
                    id="syncStatus"
                    class="sync-status"
                >
                    Guardado localmente.
                </div>

            </section>


            <!-- INVENTARIO -->

            <section class="card">

                <div class="list-header">

                    <h2>
                        Inventario
                    </h2>

                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        placeholder="Buscar código o marca..."
                    >

                </div>


                <div
                    id="inventoryCount"
                    class="inventory-count"
                >
                    0 registros
                </div>


                <div class="table-container">

                    <table
                        class="inventory-table"
                    >

                        <thead>

                            <tr>

                                <th>
                                    Código
                                </th>

                                <th>
                                    Marca
                                </th>

                                <th>
                                    Precio
                                </th>

                                <th>
                                    Acciones
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="inventoryBody"
                        >
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>


    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>

</html>
